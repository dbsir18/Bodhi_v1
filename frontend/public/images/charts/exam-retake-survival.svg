<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .tick { fill: #78716c; font-size: 13px; }
    .note { fill: #a8a29e; font-size: 13px; font-style: italic; }
  </style>
  <rect x="0" y="0" width="960" height="640" rx="16" fill="url(#bg)"/>
  <text x="56" y="58" fill="#e7e5e4" font-size="24" font-weight="600">Retake a very good exam and almost half of the top 1% drop out</text>
  <text x="56" y="88" fill="#78716c" font-size="14.5">Of the 1,000 students in the top 1% on one sitting, how many are still there on a second sitting</text>

  <line x1="130" y1="445" x2="830" y2="445" stroke="#44403c" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="130" y1="350" x2="830" y2="350" stroke="#44403c" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="130" y1="255" x2="830" y2="255" stroke="#44403c" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="130" y1="540" x2="830" y2="540" stroke="#57534e" stroke-width="2"/>
  <text x="118" y="544" text-anchor="end" class="tick">0</text>
  <text x="118" y="449" text-anchor="end" class="tick">250</text>
  <text x="118" y="354" text-anchor="end" class="tick">500</text>
  <text x="118" y="259" text-anchor="end" class="tick">750</text>
  <line x1="130" y1="160" x2="830" y2="160" stroke="#57534e" stroke-width="1" stroke-dasharray="4 6"/>
  <text x="826" y="150" text-anchor="end" class="note">all 1,000 were in the top 1% on the first sitting</text>

    <rect x="162.5" y="286.2" width="110" height="253.8" rx="4" fill="#a8a29e" opacity="0.55"/>
  <text x="217.5" y="276.2" text-anchor="middle" fill="#f5f5f4" font-size="16" font-weight="600">668</text>
  <text x="217.5" y="568" text-anchor="middle" fill="#e7e5e4" font-size="15" font-weight="600">0.95</text>
  <text x="217.5" y="588" text-anchor="middle" class="note">excellent</text>
  <rect x="337.5" y="334.8" width="110" height="205.2" rx="4" fill="#f59e0b" opacity="1"/>
  <text x="392.5" y="324.8" text-anchor="middle" fill="#f5f5f4" font-size="16" font-weight="600">540</text>
  <text x="392.5" y="568" text-anchor="middle" fill="#e7e5e4" font-size="15" font-weight="600">0.90</text>
  <text x="392.5" y="588" text-anchor="middle" class="note">very good</text>
  <rect x="512.5" y="397.5" width="110" height="142.5" rx="4" fill="#a8a29e" opacity="0.55"/>
  <text x="567.5" y="387.5" text-anchor="middle" fill="#f5f5f4" font-size="16" font-weight="600">375</text>
  <text x="567.5" y="568" text-anchor="middle" fill="#e7e5e4" font-size="15" font-weight="600">0.80</text>
  <text x="567.5" y="588" text-anchor="middle" class="note">good</text>
  <rect x="687.5" y="436.6" width="110" height="103.4" rx="4" fill="#a8a29e" opacity="0.55"/>
  <text x="742.5" y="426.6" text-anchor="middle" fill="#f5f5f4" font-size="16" font-weight="600">272</text>
  <text x="742.5" y="568" text-anchor="middle" fill="#e7e5e4" font-size="15" font-weight="600">0.70</text>
  <text x="742.5" y="588" text-anchor="middle" class="note">noisy</text>

  <text x="480" y="618" text-anchor="middle" fill="#78716c" font-size="14">How well two sittings of the exam agree (1.0 = identical rankings)</text>
</svg>
