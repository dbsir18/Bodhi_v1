<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .tick { fill: #78716c; font-size: 13px; }
    .note { fill: #a8a29e; font-size: 13px; font-style: italic; }
  </style>
  <rect x="0" y="0" width="960" height="640" rx="16" fill="url(#bg)"/>
  <text x="56" y="56" fill="#e7e5e4" font-size="24" font-weight="600">A real 2-point edge wins 63 games in 100 between two players,</text>
  <text x="56" y="86" fill="#e7e5e4" font-size="24" font-weight="600">but only 33 at a table of four</text>
  <text x="56" y="116" fill="#78716c" font-size="14.5">How often the best player wins, by skill gap, when the cards swing a score by about 6 points</text>

  <line x1="130" y1="445" x2="820" y2="445" stroke="#44403c" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="130" y1="350" x2="820" y2="350" stroke="#44403c" stroke-width="1" stroke-dasharray="4 6"/>
