  <text x="820" y="566" text-anchor="middle" class="tick">12</text>
  <text x="475" y="596" text-anchor="middle" fill="#78716c" font-size="14">Skill gap (points per game, best player minus worst)</text>

  <line x1="475" y1="350" x2="820" y2="350" stroke="#57534e" stroke-width="1" stroke-dasharray="4 6"/>
  <text x="816" y="342" text-anchor="end" class="note">coin flip</text>
