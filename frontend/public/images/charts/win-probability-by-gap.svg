  <text x="118" y="354" text-anchor="end" class="tick">50%</text>
  <text x="118" y="259" text-anchor="end" class="tick">75%</text>
  <text x="118" y="164" text-anchor="end" class="tick">100%</text>
  <text x="130" y="566" text-anchor="middle" class="tick">0</text>
  <text x="187.5" y="566" text-anchor="middle" class="tick">1</text>
  <text x="245" y="566" text-anchor="middle" class="tick">2</text>
