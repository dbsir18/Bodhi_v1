<svg width="1160" height="400" viewBox="0 0 1160 400" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>A scattered pile of mismatched squares reduces to a single hexagon, which reduces to a single point, evenly spaced</title>
<desc>Minimalist black and white illustration for an essay about first principles thinking. Three stages are spaced at equal intervals across the frame. On the left, a scattered cluster of overlapping squares at different sizes and rotations represents accumulated assumption and inherited convention. An arrow leads to a single clean hexagon in the middle, representing one well-formed question. A second arrow of matching visual weight leads to a single solid point on the right, representing the one irreducible fact underneath everything else.</desc>
<defs>
<marker id="arrowhead3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#7a7a7a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="1160" height="400" fill="#000000"/>

<!-- Stage 1, center x=200: scattered mismatched squares, inherited convention -->
<g fill="none" stroke="#ffffff" stroke-width="1.8">
<rect x="163" y="160" width="70" height="70" transform="rotate(8 198 195)"/>
<rect x="135" y="205" width="54" height="54" transform="rotate(-14 162 232)"/>
<rect x="210" y="215" width="60" height="60" transform="rotate(21 240 245)"/>
<rect x="185" y="150" width="42" height="42" transform="rotate(-30 206 171)"/>
<rect x="150" y="170" width="36" height="36" transform="rotate(45 168 188)"/>
<rect x="220" y="170" width="34" height="34" transform="rotate(12 237 187)"/>
</g>

<!-- arrow 1, evenly spaced -->
<line x1="300" y1="200" x2="512" y2="200" stroke="#7a7a7a" stroke-width="2.2" marker-end="url(#arrowhead3)"/>

<!-- Stage 2, center x=580: one well-formed hexagon -->
<polygon points="580,152 621.6,176 621.6,224 580,248 538.4,224 538.4,176" fill="none" stroke="#ffffff" stroke-width="2"/>

<!-- arrow 2, same length and weight as arrow 1 -->
<line x1="648" y1="200" x2="860" y2="200" stroke="#7a7a7a" stroke-width="2.2" marker-end="url(#arrowhead3)"/>

<!-- Stage 3, center x=960: the single irreducible point -->
<circle cx="960" cy="200" r="11" fill="#ffffff"/>
</svg>
